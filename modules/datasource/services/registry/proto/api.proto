syntax = "proto3";

// The datasource registry: the generic half of the module.
//
// It knows no datasource. Its catalog is what the datasources a deployment
// composed have announced about themselves, so a deployment adds one by
// composing it — never by changing anything here. A datasource announces
// itself and renews; the catalog is what is currently announced, which makes
// it what is actually running rather than what someone once wrote down.
package api;

// Keep the Go import path stable while the protobuf package remains free to
// evolve into a versioned wire namespace (for example datasource.registry.v1).
option go_package = "registry/pkg/gen;gen";

import "google/api/annotations.proto";

// VersionRequest asks which build is serving.
message VersionRequest {
}

// VersionResponse carries the serving build's version.
message VersionResponse {
    // version is the service version codefly stamped into this build.
    string version = 1;
}

// Datasource is a datasource as it describes itself. Every field is the
// datasource's own answer: the registry neither interprets nor validates
// them, because a registry that understood them would be a registry that has
// to change when a new kind of datasource arrives.
message Datasource {
    // name is the datasource's stable identifier within the deployment.
    string name = 1;
    // title is a short human label.
    string title = 2;
    // kinds are whatever the datasource says it can reach.
    repeated string kinds = 3;
    // requires_credential reports whether a read needs one.
    bool requires_credential = 4;
    // streams reports whether items arrive as a stream.
    bool streams = 5;
    // address is where a consumer reaches this datasource's own API. The
    // module publishes no single interface, so a consumer dials the
    // datasource directly and speaks whatever the datasource speaks.
    string address = 6;
}

// AnnounceRequest is a datasource joining the catalog, or renewing its place
// in it. Announcing again replaces what the catalog holds, so a datasource
// that changed what it can do says so by announcing it.
message AnnounceRequest {
    // datasource is what to publish.
    Datasource datasource = 1;
}

// AnnounceResponse tells the datasource when to announce again.
message AnnounceResponse {
    // renew_within_seconds is how long this announcement stands. A datasource
    // that has not renewed within it leaves the catalog, so a catalog never
    // advertises something that stopped running.
    int64 renew_within_seconds = 1;
}

// GetCatalogRequest asks what this deployment's datasources are.
message GetCatalogRequest {
}

// GetCatalogResponse is the catalog: every datasource currently announced, in
// name order so two reads of an unchanged catalog read the same.
message GetCatalogResponse {
    // datasources are what the deployment composed and what is running.
    repeated Datasource datasources = 1;
}

// RegistryService is the catalog of a deployment's datasources.
service RegistryService {
    // Version answers which build is serving.
    rpc Version(VersionRequest) returns (VersionResponse) {
        option (google.api.http) = {
            get: "/version"
        };
    }

    // Announce publishes a datasource, or renews it.
    rpc Announce(AnnounceRequest) returns (AnnounceResponse) {
        option (google.api.http) = {
            post: "/datasources:announce"
            body: "*"
        };
    }

    // GetCatalog answers every datasource currently announced.
    rpc GetCatalog(GetCatalogRequest) returns (GetCatalogResponse) {
        option (google.api.http) = {
            get: "/datasources"
        };
    }
}
