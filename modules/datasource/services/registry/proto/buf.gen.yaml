version: v1
# Go package identity is explicit in this module's own proto. Managed rewriting
# couples Go package names to protobuf namespaces and breaks versioned wire
# packages.
#
# Everything under codefly/ is IMPORT-ONLY (codefly/VENDORED.md): the linked
# Codefly core registers those descriptors, and a second, locally generated
# registration of the same path panics at init. So every plugin that resolves Go
# import paths maps each vendored file onto core's own package, and generation is
# limited to this module's own proto with `--path`. The list is every file in the
# vendored tree, so one rule with no exception to remember survives a re-sync.
managed:
  enabled: false
plugins:
  - name: go
    path: protoc-gen-go
    out: ../code/pkg/gen
    opt:
      - paths=source_relative
      - Mcodefly/base/v0/agent.proto=github.com/codefly-dev/core/generated/go/codefly/base/v0
      - Mcodefly/base/v0/endpoint.proto=github.com/codefly-dev/core/generated/go/codefly/base/v0
      - Mcodefly/base/v0/library.proto=github.com/codefly-dev/core/generated/go/codefly/base/v0
      - Mcodefly/base/v0/network.proto=github.com/codefly-dev/core/generated/go/codefly/base/v0
      - Mcodefly/base/v0/readiness.proto=github.com/codefly-dev/core/generated/go/codefly/base/v0
      - Mcodefly/base/v0/runnable.proto=github.com/codefly-dev/core/generated/go/codefly/base/v0
      - Mcodefly/base/v0/scope.proto=github.com/codefly-dev/core/generated/go/codefly/base/v0
      - Mcodefly/base/v0/work_context.proto=github.com/codefly-dev/core/generated/go/codefly/base/v0
      - Mcodefly/runnable/v0/options.proto=github.com/codefly-dev/core/generated/go/codefly/runnable/v0
  - name: go-grpc
    path: protoc-gen-go-grpc
    out: ../code/pkg/gen
    opt:
      - paths=source_relative
      - Mcodefly/base/v0/agent.proto=github.com/codefly-dev/core/generated/go/codefly/base/v0
      - Mcodefly/base/v0/endpoint.proto=github.com/codefly-dev/core/generated/go/codefly/base/v0
      - Mcodefly/base/v0/library.proto=github.com/codefly-dev/core/generated/go/codefly/base/v0
      - Mcodefly/base/v0/network.proto=github.com/codefly-dev/core/generated/go/codefly/base/v0
      - Mcodefly/base/v0/readiness.proto=github.com/codefly-dev/core/generated/go/codefly/base/v0
      - Mcodefly/base/v0/runnable.proto=github.com/codefly-dev/core/generated/go/codefly/base/v0
      - Mcodefly/base/v0/scope.proto=github.com/codefly-dev/core/generated/go/codefly/base/v0
      - Mcodefly/base/v0/work_context.proto=github.com/codefly-dev/core/generated/go/codefly/base/v0
      - Mcodefly/runnable/v0/options.proto=github.com/codefly-dev/core/generated/go/codefly/runnable/v0
  - name: grpc-gateway
    path: protoc-gen-grpc-gateway
    out: ../code/pkg/gen
    opt:
      - paths=source_relative
      - Mcodefly/base/v0/agent.proto=github.com/codefly-dev/core/generated/go/codefly/base/v0
      - Mcodefly/base/v0/endpoint.proto=github.com/codefly-dev/core/generated/go/codefly/base/v0
      - Mcodefly/base/v0/library.proto=github.com/codefly-dev/core/generated/go/codefly/base/v0
      - Mcodefly/base/v0/network.proto=github.com/codefly-dev/core/generated/go/codefly/base/v0
      - Mcodefly/base/v0/readiness.proto=github.com/codefly-dev/core/generated/go/codefly/base/v0
      - Mcodefly/base/v0/runnable.proto=github.com/codefly-dev/core/generated/go/codefly/base/v0
      - Mcodefly/base/v0/scope.proto=github.com/codefly-dev/core/generated/go/codefly/base/v0
      - Mcodefly/base/v0/work_context.proto=github.com/codefly-dev/core/generated/go/codefly/base/v0
      - Mcodefly/runnable/v0/options.proto=github.com/codefly-dev/core/generated/go/codefly/runnable/v0
  - name: connect-go
    path: protoc-gen-connect-go
    out: ../code/pkg/gen
    opt:
      - paths=source_relative
      - Mcodefly/base/v0/agent.proto=github.com/codefly-dev/core/generated/go/codefly/base/v0
      - Mcodefly/base/v0/endpoint.proto=github.com/codefly-dev/core/generated/go/codefly/base/v0
      - Mcodefly/base/v0/library.proto=github.com/codefly-dev/core/generated/go/codefly/base/v0
      - Mcodefly/base/v0/network.proto=github.com/codefly-dev/core/generated/go/codefly/base/v0
      - Mcodefly/base/v0/readiness.proto=github.com/codefly-dev/core/generated/go/codefly/base/v0
      - Mcodefly/base/v0/runnable.proto=github.com/codefly-dev/core/generated/go/codefly/base/v0
      - Mcodefly/base/v0/scope.proto=github.com/codefly-dev/core/generated/go/codefly/base/v0
      - Mcodefly/base/v0/work_context.proto=github.com/codefly-dev/core/generated/go/codefly/base/v0
      - Mcodefly/runnable/v0/options.proto=github.com/codefly-dev/core/generated/go/codefly/runnable/v0
  - name: openapiv2
    path: protoc-gen-openapiv2
    out: ../openapi
    opt:
      - Mcodefly/base/v0/agent.proto=github.com/codefly-dev/core/generated/go/codefly/base/v0
      - Mcodefly/base/v0/endpoint.proto=github.com/codefly-dev/core/generated/go/codefly/base/v0
      - Mcodefly/base/v0/library.proto=github.com/codefly-dev/core/generated/go/codefly/base/v0
      - Mcodefly/base/v0/network.proto=github.com/codefly-dev/core/generated/go/codefly/base/v0
      - Mcodefly/base/v0/readiness.proto=github.com/codefly-dev/core/generated/go/codefly/base/v0
      - Mcodefly/base/v0/runnable.proto=github.com/codefly-dev/core/generated/go/codefly/base/v0
      - Mcodefly/base/v0/scope.proto=github.com/codefly-dev/core/generated/go/codefly/base/v0
      - Mcodefly/base/v0/work_context.proto=github.com/codefly-dev/core/generated/go/codefly/base/v0
      - Mcodefly/runnable/v0/options.proto=github.com/codefly-dev/core/generated/go/codefly/runnable/v0
