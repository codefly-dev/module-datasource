version: v1
# The bucket datasource's client, generated from its own proto. The playground
# calls it as any consumer would; nothing here is hand-written.
managed:
  enabled: false
plugins:
  - name: go
    path: protoc-gen-go
    out: ./bucket
    opt: paths=source_relative
  - name: go-grpc
    path: protoc-gen-go-grpc
    out: ./bucket
    opt: paths=source_relative
