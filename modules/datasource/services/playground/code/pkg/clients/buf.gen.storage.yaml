version: v1
# The object-storage gateway's client, from the contract pinned in
# contracts/object-storage. The playground writes the object it then reads back
# through the datasource, and a write is not a bound operation.
managed:
  enabled: false
plugins:
  - name: go
    path: protoc-gen-go
    out: ./storage
    opt: paths=source_relative
  - name: go-grpc
    path: protoc-gen-go-grpc
    out: ./storage
    opt: paths=source_relative
